<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Accessible examples</title>
  </head>
  <body>
    <button type="button" aria-label="Close">
      <svg aria-hidden="true"></svg>
    </button>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" autocomplete="email" />
    <img src="photo.jpg" alt="Team working at a laptop in a bright studio" />
  </body>
</html>
